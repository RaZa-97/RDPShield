<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDPShield — Forgot password</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/logo.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
    <div class="auth-card">
        <div class="auth-brand">
            <img src="{{ url_for('static', filename='img/logo.svg') }}" class="brand-logo" alt="">
            <div>
                <div class="auth-title">RDPSHIELD</div>
                <div class="auth-tag">RDP Threat Defense</div>
            </div>
        </div>

        <div class="auth-step">RECOVERY / SEND CODE</div>
        <h1 class="auth-h1">Forgot password</h1>
        <p class="auth-sub">Enter your username. If a phone number is on file, we'll text you a
            6-digit reset code via SMS.</p>

        {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}

        <form method="POST" action="/forgot" class="auth-form">
            <label class="auth-label" for="username">Username</label>
            <input class="form-input auth-input" type="text" id="username" name="username"
                   autocomplete="username" autofocus required>
            <button type="submit" class="btn-apply auth-submit">Send reset code &rarr;</button>
        </form>

        <div class="auth-links"><a href="/login" class="auth-back">&larr; Back to sign in</a></div>
    </div>
</body>
</html>
